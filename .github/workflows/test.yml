name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.15"]  # oldest supported (requires-python) and newest stable
    env:
      UV_PYTHON: ${{ matrix.python }}  # uv installs this Python itself
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
      - run: uv sync --locked  # fails if uv.lock is out of date with pyproject.toml
      - run: uv run --locked pytest
