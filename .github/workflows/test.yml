name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.15"]  # oldest supported and newest stable
        exclude:
          - os: ubuntu-latest  # Ubuntu 26.04 has no Python 3.9 build...
            python: "3.9"
        include:
          - os: ubuntu-24.04   # ...24.04 still does
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
