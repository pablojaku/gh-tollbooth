[project]
name = "gh-tollbooth"
version = "0.1.0"
description = "One machine-wide, throttled, read-only request stream to GitHub for AI agents"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.1",
    "filelock>=4.3.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # the modules live in scripts/, next to the skill's entry point
